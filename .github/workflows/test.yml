name: "🧪 Test"

on:
    push:
        branches:
            - "main"
            - "dev"
        paths:
            - "apps/backend/**"
            - "packages/utils/**"
            - "packages/models/**"
            - "pnpm-lock.yaml"
            - ".github/workflows/test.yml"
    pull_request:
        branches:
            - "main"
            - "dev"
        paths:
            - "apps/backend/**"
            - "packages/utils/**"
            - "packages/models/**"
            - "pnpm-lock.yaml"
            - ".github/workflows/test.yml"

jobs:
    deploy:
        name: "🧪 Test"
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: kontestis
                    POSTGRES_USER: kontestis
                    POSTGRES_PASSWORD: kontestis
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U kontestis -d kontestis"
                    --health-interval 2s
                    --health-timeout 5s
                    --health-retries 20
        env:
            DATABASE_URL: postgresql://kontestis:kontestis@localhost:5432/kontestis
            JWT_SECRET: ci-only-secret
        steps:
            - uses: actions/checkout@v3

            - name: Install PNPM
              uses: pnpm/action-setup@v2
              with:
                  version: 9.7.1

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: 18
                  cache: "pnpm"

            - name: Install packages
              run: pnpm install

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Backend tests
              run: pnpm --filter @kontestis/backend test

            - name: Utility tests
              run: pnpm --filter @kontestis/utils test
