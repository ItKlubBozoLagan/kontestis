name: "🚚 Backend auto-deployment (staging)"

on:
    push:
        branches:
            - dev
        paths:
            - "apps/backend/**"
            - "packages/**"
            - "!packages/scripts/**"
            - ".github/workflows/backend-staging-deploy.yml"
            - ".deploy/backend.dockerfile"

concurrency:
    group: backend-staging-deploy
    cancel-in-progress: false

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: "🐳 Build"
        runs-on: ubuntu-latest
        outputs:
            digest: ${{ steps.docker_build.outputs.digest }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Login to GitHub container registry
              uses: docker/login-action@v2
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              id: docker_build
              uses: docker/build-push-action@v3
              with:
                  push: true
                  context: .
                  platforms: linux/amd64
                  file: .deploy/backend.dockerfile
                  tags: ghcr.io/itklubbozolagan/kontestis-backend:dev
    release:
        name: "🚚 Release"
        runs-on: ubuntu-latest
        needs: ["build"]
        steps:
            - name: "Set up kubectl"
              uses: azure/setup-kubectl@v3

            - name: "Copy kubernetes config"
              env:
                  KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
              run: |
                  install -m 700 -d ~/.kube
                  printf '%s' "$KUBE_CONFIG_STAGING" | base64 -d > ~/.kube/config
                  chmod 600 ~/.kube/config

            - name: "Rollout an application update"
              env:
                  IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
              run: |
                  kubectl -n kontestis-staging set image deployment/kontestis-staging backend=ghcr.io/itklubbozolagan/kontestis-backend@${IMAGE_DIGEST}
                  kubectl -n kontestis-staging rollout status deployment/kontestis-staging --timeout=300s
